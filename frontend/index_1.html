<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinaCare - Medicine Manager</title>
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --success: #10b981;
            --bg-light: #f8f9fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* ROW 1: HEADER */
        .header {
            background: white;
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            text-align: center;
        }
        
        .header h1 {
            color: var(--primary);
            font-size: 2.2em;
        }
        
        /* CONTENT GRID CONFIGURATION */
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Two equal columns for Row 2 */
            grid-template-areas: 
                "add list"
                "chat chat"; /* Row 3 spans both columns */
            gap: 20px;
        }

        /* AREA ASSIGNMENTS */
        .card-add { grid-area: add; }
        .card-list { grid-area: list; }
        .card-chat { grid-area: chat; }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        
        .card h2 {
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 1.4em;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        /* ROW 2 SPECIFIC: Short & Wide */
        .card-add, .card-list {
            height: 400px; /* Constrained height */
        }

        .medicine-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* FORM STYLING */
        .form-group { margin-bottom: 12px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.85em;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }

        .btn:hover { background: #5568d3; }
        .btn:active { transform: scale(0.98); }

        /* ROW 3 SPECIFIC: Full Width & Tall */
        .card-chat {
            min-height: 550px;
        }

        .chat-box {
            display: flex;
            flex-direction: column;
            height: 100%;
            flex: 1;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: var(--bg-light);
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #eee;
        }
        
        .chat-message {
            margin-bottom: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 75%;
            line-height: 1.4;
        }
        
        .chat-message.user {
            background: var(--primary);
            color: white;
            margin-left: auto;
        }
        
        .chat-message.mina {
            background: white;
            color: #333;
            border: 1px solid #ddd;
        }

        .sender { font-weight: bold; font-size: 0.8em; margin-bottom: 4px; display: block; }
        
        .chat-input-area {
            display: flex;
            gap: 10px;
        }
        
        .chat-input-area input {
            flex: 1;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
        }

        .btn-send {
            width: auto;
            padding: 0 30px;
            background: var(--success);
        }

        /* MEDICINE ITEM STYLING */
        .medicine-item {
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #eee;
            border-left: 4px solid var(--primary);
        }

        .medicine-details {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 800px) {
            .content {
                grid-template-columns: 1fr;
                grid-template-areas: "add" "list" "chat";
            }
            .card-add, .card-list { height: auto; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💊 MinaCare</h1>
            <p>Smart Inventory & AI Health Assistant</p>
        </div>
        
        <div class="content">
            <div class="card card-add">
                <h2>➕ Add Medicine</h2>
                <form id="addMedicineForm">
                    <div class="form-group">
                        <label>Medicine Name</label>
                        <input type="text" id="name" required placeholder="Aspirin">
                    </div>
                    <div class="form-group" style="display: flex; gap: 10px;">
                        <div style="flex: 1;">
                            <label>Dosage</label>
                            <input type="text" id="dosage" required placeholder="500mg">
                        </div>
                        <div style="flex: 1;">
                            <label>Count</label>
                            <input type="number" id="count" required min="1">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Expiration Date</label>
                        <input type="date" id="expiration_date" required>
                    </div>
                    <button type="submit" class="btn">Add to Inventory</button>
                </form>
            </div>
            
            <div class="card card-list">
                <h2>📋 Medicine List</h2>
                <div id="medicineList" class="medicine-list">
                    </div>
            </div>
            
            <div class="card card-chat">
                <h2>💬 Chat with Mina Agent</h2>
                <div class="chat-box">
                    <div id="chatMessages" class="chat-messages">
                        <div class="chat-message mina">
                            <span class="sender">Mina</span>
                            <div class="content">Hi! I'm your health assistant. Tell me how you feel, and I'll check your cabinet to help! 💙</div>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="chatInput" placeholder="Describe your symptoms..." onkeypress="if(event.key==='Enter') sendMessage()">
                        <button onclick="sendMessage()" id="sendBtn" class="btn btn-send">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        
        // Initial Load
        window.onload = loadMedicines;
        
        // --- INVENTORY FUNCTIONS ---
        document.getElementById('addMedicineForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const medicine = {
                name: document.getElementById('name').value,
                dosage: document.getElementById('dosage').value,
                count: parseInt(document.getElementById('count').value),
                expiration_date: document.getElementById('expiration_date').value
            };
            
            try {
                const response = await fetch(`${API_BASE}/medicines`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(medicine)
                });
                
                if (response.ok) {
                    document.getElementById('addMedicineForm').reset();
                    loadMedicines();
                }
            } catch (error) {
                console.error('Error adding medicine:', error);
            }
        });
        
        async function loadMedicines() {
            const listDiv = document.getElementById('medicineList');
            try {
                const response = await fetch(`${API_BASE}/medicines`);
                const medicines = await response.json();
                
                if (medicines.length === 0) {
                    listDiv.innerHTML = '<p style="text-align:center; color:#999; margin-top:20px;">Inventory is empty.</p>';
                } else {
                    listDiv.innerHTML = medicines.map(med => `
                        <div class="medicine-item">
                            <strong>${med.name}</strong>
                            <div class="medicine-details">
                                <span>Dosage: ${med.dosage}</span>
                                <span>Qty: ${med.count}</span>
                                <span>Exp: ${med.expiration_date}</span>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                listDiv.innerHTML = '<p style="color:red;">Error connecting to backend.</p>';
            }
        }
        
        // --- CHAT FUNCTIONS ---
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const messageText = input.value.trim(); // FIXED: Capture input value here
            
            if (!messageText) return;
            
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            
            // 1. Add User Message
            addMessageToChat('user', 'You', messageText);
            input.value = '';

            // 2. Show Thinking State
            const thinkingId = addMessageToChat('mina', 'Mina', 'Thinking... 🔍');
            
            try {
                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: messageText })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    updateMessage(thinkingId, data.reply);
                } else {
                    updateMessage(thinkingId, 'I had trouble understanding that. Please try again.');
                }
            } catch (error) {
                updateMessage(thinkingId, 'Connection lost. Is the backend running?');
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        function addMessageToChat(type, sender, message) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            const id = 'msg-' + Date.now();

            messageDiv.className = `chat-message ${type}`;
            messageDiv.id = id;
            messageDiv.innerHTML = `
                <span class="sender">${sender}</span>
                <div class="content">${message}</div>
            `;

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return id;
        }

        function updateMessage(id, newText) {
            const msg = document.getElementById(id);
            if (msg) msg.querySelector('.content').innerHTML = newText;
        }
    </script>
</body>
</html>
